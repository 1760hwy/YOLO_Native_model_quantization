# fire_detect_config.yaml
# =============================================
# RDK X5 (Bayes-e BPU) Quantization Config
# =============================================
#
# IMPORTANT NOTES:
#   1. scale_value = 1/255 means BPU handles normalization
#      So calibration data MUST be 0~255 range (NOT 0~1)
#   2. node_info forces Attention Softmax to BPU
#      Without this, model splits into 10+ subgraphs, FPS drops to <10
#   3. The Softmax node name may differ by model variant:
#      - YOLO11n: /model.10/m/m.0/attn/Softmax
#      - YOLO11s: may have additional Softmax nodes
#      Use: python -c "import onnx; m=onnx.load('fire_detect.onnx'); [print(n.name) for n in m.graph.node if 'Softmax' in n.op_type]"

model_parameters:
  onnx_model: './fire_detect.onnx'
  march: 'bayes-e'
  output_model_file_prefix: 'fire_detect'
  node_info: {
    "/model.10/m/m.0/attn/Softmax": {
      'ON': 'BPU',
      'InputType': 'int16',
      'OutputType': 'int16'
    }
  }

input_parameters:
  input_name: 'images'
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  scale_value: '0.003921568627451'  # = 1/255, BPU auto-normalizes

calibration_parameters:
  cal_data_dir: '/fire_quant/calibration_f32'
  cal_data_type: 'float32'
  calibration_type: 'max'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
